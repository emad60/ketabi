name: CI - Backend tests + Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations (test settings)
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
        run: |
          python backend/manage.py migrate --settings=core.test_settings

      - name: Seed DB (deterministic)
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
        run: |
          python backend/manage.py seed_data --settings=core.test_settings

      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
        run: |
          python backend/manage.py test --settings=core.test_settings

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci --no-audit --progress=false

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Start backend server (background)
        env:
          DJANGO_SETTINGS_MODULE: core.test_settings
        run: |
          nohup python backend/manage.py runserver 0.0.0.0:8000 --settings=core.test_settings > backend-server.log 2>&1 &
          # Wait for API to respond
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/ >/dev/null; then
              echo "API is up"; break
            fi
            echo "Waiting for API... ($i)"; sleep 1
          done

      - name: Serve frontend (background)
        working-directory: ./frontend
        run: |
          # Serve SPA with fallback so client-side routes return index.html
          npx serve -s dist -l 3000 >/tmp/serve.log 2>&1 &
          for i in {1..20}; do
            if curl -sSf http://localhost:3000/ >/dev/null; then
              echo "Frontend is up"; break
            fi
            echo "Waiting for frontend... ($i)"; sleep 1
          done

      - name: Generate Playwright storage state (login)
        working-directory: ./frontend
        env:
          API_BASE: http://localhost:8000/api
          BASE_URL: http://localhost:3000
        run: |
          # create a storage state file that Playwright can consume
          node ./playwright/generate-state.mjs ${E2E_PROVINCE_USERNAME:-province_admin} ${E2E_PROVINCE_PASSWORD:-provincepass} state.json

      - name: Run Playwright E2E
        working-directory: ./frontend
        env:
          API_BASE_URL: http://localhost:8000/api
          BASE_URL: http://localhost:3000
          E2E_PROVINCE_USERNAME: province_admin
          E2E_PROVINCE_PASSWORD: provincepass
          E2E_MINISTRY_USERNAME: ministry_admin
          E2E_MINISTRY_PASSWORD: ministrypass
        run: |
          # Run Playwright with retries and single worker to reduce flakiness on CI
          npx playwright test --project=chromium --retries=2 --workers=1 --reporter=list --storage-state=state.json

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
